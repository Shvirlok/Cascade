<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Component Box Gradients -->
    <linearGradient id="box-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F1D1D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#991B1B" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="box-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="box-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6B21A8" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="box-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="box-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164E63" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Arrow Marker Definition -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C084FC" />
    </marker>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="680" fill="url(#arch-bg)" rx="16"/>

  <!-- Diagram Title -->
  <text x="50" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">CASCADE End-to-End System Architecture</text>
  <text x="550" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748B">Reactive Event Pipeline, Vector Recall, &amp; Autonomous Multi-Agent Healing</text>
  <line x1="50" y1="65" x2="1150" y2="65" stroke="#334155" stroke-width="1"/>

  <!-- STEP 1: External Disruption Input -->
  <g transform="translate(50, 100)">
    <rect width="220" height="110" rx="12" fill="url(#box-red)" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#EF4444" fill-opacity="0.3"/>
    <text x="20" y="31" font-family="sans-serif" font-size="14" font-weight="900" fill="#FCA5A5">1</text>
    <text x="48" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">DISRUPTION TRIGGER</text>
    <text x="16" y="60" font-family="sans-serif" font-size="12" font-weight="600" fill="#FECACA">External Disruption API</text>
    <text x="16" y="80" font-family="sans-serif" font-size="11" font-weight="400" fill="#FCA5A5">• Flight DL-1402 Delay (+150m)</text>
    <text x="16" y="95" font-family="sans-serif" font-size="11" font-weight="400" fill="#FCA5A5">• Train Cancel / Overbook</text>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <path d="M 270 155 L 330 155" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="282" y="145" font-family="sans-serif" font-size="10" font-weight="600" fill="#38BDF8">DB Mutation</text>

  <!-- STEP 2: CockroachDB Storage & Changefeed -->
  <g transform="translate(340, 90)">
    <rect width="250" height="130" rx="12" fill="url(#box-blue)" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#3B82F6" fill-opacity="0.3"/>
    <text x="20" y="31" font-family="sans-serif" font-size="14" font-weight="900" fill="#93C5FD">2</text>
    <text x="48" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">COCKROACHDB CLOUD</text>
    
    <rect x="16" y="48" width="218" height="28" rx="6" fill="#0F172A" stroke="#1E40AF" stroke-width="1"/>
    <text x="24" y="66" font-family="monospace" font-size="10" fill="#60A5FA">ACID Graph + VECTOR(1536)</text>
    
    <rect x="16" y="84" width="218" height="28" rx="6" fill="#0F172A" stroke="#1E40AF" stroke-width="1"/>
    <text x="24" y="102" font-family="monospace" font-size="10" fill="#38BDF8">CDC Changefeed Sink</text>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <path d="M 590 155 L 650 155" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="595" y="145" font-family="sans-serif" font-size="10" font-weight="600" fill="#38BDF8">Changefeed</text>

  <!-- STEP 3: CDC Listener Service -->
  <g transform="translate(660, 100)">
    <rect width="210" height="110" rx="12" fill="url(#box-cyan)" stroke="#06B6D4" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#06B6D4" fill-opacity="0.3"/>
    <text x="20" y="31" font-family="sans-serif" font-size="14" font-weight="900" fill="#A5F3FC">3</text>
    <text x="48" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">CDC LISTENER</text>
    <text x="16" y="60" font-family="sans-serif" font-size="12" font-weight="600" fill="#E0F2FE">Node.js / Express Webhook</text>
    <text x="16" y="80" font-family="sans-serif" font-size="11" font-weight="400" fill="#7DD3FC">• Instant Event Dispatch</text>
    <text x="16" y="95" font-family="sans-serif" font-size="11" font-weight="400" fill="#7DD3FC">• Real-Time SSE Hub</text>
  </g>

  <!-- Flow Connector 3 -> 4 (Downwards) -->
  <path d="M 765 210 L 765 270" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="775" y="245" font-family="sans-serif" font-size="10" font-weight="600" fill="#38BDF8">Trigger Agent</text>

  <!-- STEP 4: AWS Bedrock & Multi-Agent Engine (Central Large Box) -->
  <g transform="translate(340, 280)">
    <rect width="810" height="220" rx="14" fill="url(#box-purple)" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#8B5CF6" fill-opacity="0.4"/>
    <text x="26" y="38" font-family="sans-serif" font-size="16" font-weight="900" fill="#E9D5FF">4</text>
    <text x="60" y="38" font-family="sans-serif" font-size="15" font-weight="800" fill="#F8FAFC">AWS BEDROCK MULTI-AGENT ENGINE (Claude 3.5 Sonnet)</text>
    
    <!-- Sub-component 1: Vector Search & Memory -->
    <g transform="translate(20, 60)">
      <rect width="240" height="140" rx="10" fill="#0F172A" stroke="#7C3AED" stroke-width="1"/>
      <text x="14" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#C084FC">1. Vector Memory Recall</text>
      <text x="14" y="48" font-family="monospace" font-size="10" fill="#DDD6FE">HNSW vector_cosine_ops</text>
      <text x="14" y="68" font-family="sans-serif" font-size="11" fill="#94A3B8">• User Pref Embedding (1536d)</text>
      <text x="14" y="86" font-family="sans-serif" font-size="11" fill="#94A3B8">• Quiet Car / Cabin Priority</text>
      <text x="14" y="104" font-family="sans-serif" font-size="11" fill="#94A3B8">• Layover Tolerance Filtering</text>
      <text x="14" y="122" font-family="monospace" font-size="10" fill="#34D399">Cosine Similarity: 0.984</text>
    </g>

    <!-- Sub-component 2: Predictive Risk Engine -->
    <g transform="translate(285, 60)">
      <rect width="240" height="140" rx="10" fill="#0F172A" stroke="#7C3AED" stroke-width="1"/>
      <text x="14" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#C084FC">2. Risk Evaluation</text>
      <text x="14" y="48" font-family="sans-serif" font-size="11" fill="#94A3B8">• Disruption Severity Score</text>
      <text x="14" y="68" font-family="sans-serif" font-size="11" fill="#94A3B8">• Slack Window (-195m Overlap)</text>
      <text x="14" y="86" font-family="sans-serif" font-size="11" fill="#94A3B8">• +45m Layover Recommendation</text>
      <text x="14" y="108" font-family="monospace" font-size="10" fill="#F472B6">Risk Score: 78% High</text>
    </g>

    <!-- Sub-component 3: Branch Optimization (Alpha vs Beta vs Gamma) -->
    <g transform="translate(550, 60)">
      <rect width="240" height="140" rx="10" fill="#0F172A" stroke="#7C3AED" stroke-width="1"/>
      <text x="14" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#C084FC">3. Multi-Branch Evaluation</text>
      <text x="14" y="46" font-family="sans-serif" font-size="11" fill="#64748B">Branch Alpha (Speed): 0.74</text>
      <text x="14" y="64" font-family="sans-serif" font-size="11" fill="#64748B">Branch Beta (Cost $0): 0.82</text>
      <text x="14" y="84" font-family="sans-serif" font-size="11" font-weight="700" fill="#34D399">✓ Branch Gamma (HNSW Winner): 0.96</text>
      <text x="14" y="104" font-family="sans-serif" font-size="11" fill="#94A3B8">Amtrak Acela 2158 First Class</text>
      <text x="14" y="122" font-family="monospace" font-size="10" fill="#FBBF24">Carrier Covered ($0.00)</text>
    </g>
  </g>

  <!-- STEP 5: Model Context Protocol (MCP) Tool Bridge (Left Side) -->
  <g transform="translate(50, 280)">
    <rect width="250" height="220" rx="14" fill="url(#box-green)" stroke="#10B981" stroke-width="1.5"/>
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#10B981" fill-opacity="0.3"/>
    <text x="24" y="34" font-family="sans-serif" font-size="15" font-weight="900" fill="#A7F3D0">5</text>
    <text x="54" y="34" font-family="sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">MCP TOOLS SERVER</text>
    
    <g transform="translate(14, 55)">
      <rect width="222" height="150" rx="8" fill="#0F172A" stroke="#047857" stroke-width="1"/>
      <text x="10" y="22" font-family="monospace" font-size="10" fill="#34D399">• get_itinerary_graph</text>
      <text x="10" y="42" font-family="monospace" font-size="10" fill="#34D399">• search_user_preferences_vector</text>
      <text x="10" y="62" font-family="monospace" font-size="10" fill="#34D399">• query_transit_availability</text>
      <text x="10" y="82" font-family="monospace" font-size="10" fill="#34D399">• estimate_cascade_impact</text>
      <text x="10" y="102" font-family="monospace" font-size="10" fill="#34D399">• update_segment_status</text>
      <text x="10" y="122" font-family="monospace" font-size="10" fill="#34D399">• rebook_cascade_segment</text>
    </g>
  </g>

  <!-- Flow Connector 4 <-> 5 (Bidirectional MCP Tool Calls) -->
  <path d="M 340 390 L 300 390" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 300 410 L 340 410" fill="none" stroke="#C084FC" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- STEP 6: CockroachDB ACID Atomic Commit (Bottom Center) -->
  <g transform="translate(340, 540)">
    <rect width="380" height="110" rx="12" fill="url(#box-blue)" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#3B82F6" fill-opacity="0.3"/>
    <text x="20" y="31" font-family="sans-serif" font-size="14" font-weight="900" fill="#93C5FD">6</text>
    <text x="48" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">ATOMIC SERIALIZABLE COMMIT</text>
    <text x="16" y="58" font-family="sans-serif" font-size="12" font-weight="600" fill="#93C5FD">CockroachDB Transaction Engine</text>
    <text x="16" y="78" font-family="monospace" font-size="10" fill="#60A5FA">• Isolation: SERIALIZABLE</text>
    <text x="16" y="93" font-family="monospace" font-size="10" fill="#60A5FA">• Automatic 40001 Retry &amp; Saga Rollback</text>
  </g>

  <!-- Flow Connector 4 -> 6 (Downwards) -->
  <path d="M 530 500 L 530 540" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 7: Real-Time Glassmorphism UI (Bottom Right) -->
  <g transform="translate(760, 540)">
    <rect width="390" height="110" rx="12" fill="url(#box-cyan)" stroke="#06B6D4" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#06B6D4" fill-opacity="0.3"/>
    <text x="20" y="31" font-family="sans-serif" font-size="14" font-weight="900" fill="#A5F3FC">7</text>
    <text x="48" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">INTERACTIVE DASHBOARD UI</text>
    <text x="16" y="58" font-family="sans-serif" font-size="12" font-weight="600" fill="#E0F2FE">Leaflet.js Arc Map &amp; SSE Live Feeds</text>
    <text x="16" y="78" font-family="sans-serif" font-size="11" fill="#7DD3FC">• Live Route Graph Node Transitions</text>
    <text x="16" y="93" font-family="sans-serif" font-size="11" fill="#7DD3FC">• Agent Chain-of-Thought Stream Logs</text>
  </g>

  <!-- Flow Connector 6 -> 7 -->
  <path d="M 720 595 L 760 595" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="722" y="585" font-family="sans-serif" font-size="10" font-weight="600" fill="#38BDF8">SSE Event Stream</text>
</svg>
