<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/>

  <!-- Decorative Network Nodes & Arc Grid -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="2" fill="#38BDF8"/>
    <circle cx="280" cy="180" r="3" fill="#818CF8"/>
    <circle cx="950" cy="90" r="2" fill="#C084FC"/>
    <circle cx="1080" cy="220" r="3" fill="#38BDF8"/>
    <circle cx="820" cy="340" r="2" fill="#38BDF8"/>

    <path d="M 150 80 Q 280 180 400 120 T 700 160 T 950 90" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 280 180 Q 500 300 820 340 T 1080 220" fill="none" stroke="#818CF8" stroke-width="1" stroke-dasharray="6 6"/>
  </g>

  <!-- Hero Glass Container -->
  <rect x="50" y="40" width="1100" height="340" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Decorative Line -->
  <rect x="50" y="40" width="1100" height="4" rx="2" fill="url(#primary-glow)"/>

  <!-- CASCADE Emblem Icon -->
  <g transform="translate(100, 95)" filter="url(#glow)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#cyan-glow)" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M 36 12 L 20 36 H 32 L 28 52 L 44 28 H 32 Z" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1"/>
  </g>

  <!-- Header Titles -->
  <text x="184" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="2" fill="url(#primary-glow)" filter="url(#subtle-glow)">CASCADE</text>
  
  <text x="410" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#94A3B8" letter-spacing="0.5">⚡ Autonomous Executive Travel Recovery Engine</text>

  <!-- Value Proposition Line -->
  <text x="100" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#E2E8F0" letter-spacing="0.2">
    Self-healing travel &amp; logistics orchestration powered by CockroachDB Cloud CDC, HNSW vector search, and AWS Bedrock.
  </text>

  <!-- Tech Stack Badges Layer -->
  <g transform="translate(100, 230)">
    <!-- CockroachDB Badge -->
    <g transform="translate(0, 0)">
      <rect width="240" height="36" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="18" r="6" fill="#6366F1"/>
      <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">CockroachDB Cloud (CDC)</text>
    </g>

    <!-- AWS Bedrock Badge -->
    <g transform="translate(252, 0)">
      <rect width="230" height="36" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="18" r="6" fill="#EC4899"/>
      <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">AWS Bedrock / Claude 3.5</text>
    </g>

    <!-- MCP Protocol Badge -->
    <g transform="translate(494, 0)">
      <rect width="200" height="36" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="18" r="6" fill="#10B981"/>
      <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">Model Context Protocol</text>
    </g>

    <!-- Leaflet.js Visualizer Badge -->
    <g transform="translate(706, 0)">
      <rect width="180" height="36" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="18" r="6" fill="#F59E0B"/>
      <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">Leaflet.js Visualizer</text>
    </g>
  </g>

  <!-- Key Metric Performance Cards -->
  <g transform="translate(100, 290)">
    <!-- Metric 1: SLA -->
    <g transform="translate(0, 0)">
      <rect width="230" height="60" rx="10" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">SELF-HEAL SLA</text>
      <text x="16" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#38BDF8">&lt;392 ms</text>
    </g>

    <!-- Metric 2: Vector Dim -->
    <g transform="translate(252, 0)">
      <rect width="230" height="60" rx="10" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">VECTOR SEARCH</text>
      <text x="16" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#818CF8">1536-Dim HNSW</text>
    </g>

    <!-- Metric 3: MCP Tools -->
    <g transform="translate(504, 0)">
      <rect width="230" height="60" rx="10" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">MCP TOOLS SERVER</text>
      <text x="16" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#34D399">6 Registered Tools</text>
    </g>

    <!-- Metric 4: Isolation -->
    <g transform="translate(756, 0)">
      <rect width="230" height="60" rx="10" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">TRANSACTION SAFETY</text>
      <text x="16" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#F472B6">SERIALIZABLE (40001)</text>
    </g>
  </g>
</svg>
